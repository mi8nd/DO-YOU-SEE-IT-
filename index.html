<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickology Studio</title>
  <style>
    :root {
      --ink: #171714;
      --paper: #f3f0e8;
      --orange: #ed6b32;
      --yellow: #f1c84b;
      --blue: #2857b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(23,23,20,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,23,20,.035) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      position: relative;
      overflow: hidden;
    }

    .rail {
      border-right: 3px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-direction: column;
      padding: 24px 0;
      background: rgba(243,240,232,.92);
      z-index: 2;
    }

    .logo-mark {
      width: 58px;
      height: 58px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 900;
      transform: rotate(-8deg);
    }

    .vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-transform: uppercase;
      letter-spacing: .24em;
      font-size: 11px;
      font-weight: 800;
    }

    main {
      min-width: 0;
      position: relative;
      padding: 24px 42px 38px;
    }

    nav {
      height: 58px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 34px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    nav a { color: inherit; text-decoration: none; }

    .hero {
      min-height: calc(100vh - 120px);
      display: grid;
      grid-template-columns: minmax(390px, 48%) 1fr;
      align-items: center;
    }

    .copy { position: relative; z-index: 4; }

    .eyebrow {
      display: inline-block;
      background: var(--yellow);
      border: 2px solid var(--ink);
      padding: 8px 13px;
      transform: rotate(-2deg);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 var(--ink);
    }

    h1 {
      margin: 28px 0 18px;
      max-width: 650px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(72px, 8vw, 126px);
      line-height: .82;
      letter-spacing: -.075em;
      font-weight: 900;
    }

    h1 em {
      display: block;
      color: var(--orange);
      font-style: italic;
      margin-left: 42px;
    }

    .description {
      width: 430px;
      max-width: 90%;
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.55;
      margin: 24px 0 30px;
    }

    .actions { display: flex; align-items: center; gap: 24px; }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      border: 3px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 16px 18px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      box-shadow: 7px 7px 0 var(--orange);
    }

    .button b { font-size: 20px; }

    .art {
      height: min(650px, 72vh);
      position: relative;
    }

    .sun {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background: var(--yellow);
      top: 8%;
      right: 7%;
      border: 3px solid var(--ink);
    }

    .sun:before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed var(--ink);
      transform: scale(.82);
      opacity: .7;
    }

    .character {
      position: absolute;
      width: 260px;
      height: 510px;
      right: 14%;
      bottom: 3%;
      z-index: 3;
      filter: drop-shadow(12px 14px 0 rgba(23,23,20,.12));
    }

    .head {
      position: absolute;
      left: 74px;
      top: 0;
      width: 112px;
      height: 112px;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .hair {
      position: absolute;
      width: 106px;
      height: 58px;
      left: 1px;
      top: -18px;
      border: 4px solid var(--ink);
      border-radius: 50% 50% 40% 50%;
      background: var(--ink);
      transform: rotate(-8deg);
    }

    .face-line {
      position: absolute;
      width: 45px;
      height: 18px;
      border-bottom: 3px solid var(--ink);
      border-radius: 50%;
      left: 38px;
      top: 64px;
    }

    .body {
      position: absolute;
      width: 116px;
      height: 210px;
      left: 72px;
      top: 106px;
      border: 4px solid var(--ink);
      background: var(--orange);
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
    }

    .body:after {
      content: "";
      position: absolute;
      width: 72px;
      height: 72px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      left: 19px;
      top: 45px;
    }

    .arm {
      position: absolute;
      width: 44px;
      height: 210px;
      border: 4px solid var(--ink);
      background: var(--paper);
      top: 125px;
    }

    .arm.left { left: 32px; transform: rotate(15deg); }
    .arm.right { right: 20px; transform: rotate(-18deg); }

    .leg {
      position: absolute;
      width: 54px;
      height: 210px;
      border: 4px solid var(--ink);
      background: var(--blue);
      top: 298px;
    }

    .leg.left { left: 72px; transform: rotate(4deg); }
    .leg.right { right: 66px; transform: rotate(-5deg); }

    .leg:after {
      content: "";
      position: absolute;
      width: 78px;
      height: 25px;
      background: var(--ink);
      border: 3px solid var(--ink);
      bottom: -12px;
      left: -18px;
      border-radius: 60% 20% 10% 10%;
    }

    .scribble {
      position: absolute;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 16px;
      transform: rotate(-8deg);
      right: 2%;
      bottom: 8%;
      z-index: 5;
    }

    .scribble:before {
      content: "";
      display: block;
      width: 80px;
      border-top: 3px solid var(--ink);
      transform: rotate(-16deg);
      margin-bottom: 8px;
    }

    @media (max-width: 900px) {
      .page { grid-template-columns: 74px 1fr; }
      main { padding: 18px 24px; }
      nav { gap: 18px; }
      .hero { grid-template-columns: 1fr 42%; }
      h1 { font-size: clamp(58px, 12vw, 90px); }
      .character { right: 0; transform: scale(.82); transform-origin: bottom right; }
      .sun { width: 250px; height: 250px; right: -10%; }
    }

    @media (max-width: 650px) {
      .page { grid-template-columns: 54px 1fr; }
      .rail { padding: 12px 0; }
      .logo-mark { width: 42px; height: 42px; font-size: 22px; }
      main { padding: 14px 16px 30px; }
      nav { height: 45px; }
      nav a:nth-child(2), nav a:nth-child(3) { display: none; }
      .hero { display: block; min-height: calc(100vh - 75px); }
      .copy { padding-top: 35px; }
      h1 { font-size: 58px; }
      h1 em { margin-left: 20px; }
      .description { width: 300px; font-size: 16px; }
      .art { position: absolute; width: 240px; height: 400px; right: -20px; bottom: 0; opacity: .86; }
      .character { transform: scale(.62); right: -25px; bottom: -15px; }
      .sun { width: 210px; height: 210px; right: -30px; }
      .scribble { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="rail">
      <div class="logo-mark">S</div>
      <div class="vertical">Stickology Studio</div>
    </aside>

    <main>
      <nav>
        <a href="#work">Work</a>
        <a href="#studio">Studio</a>
        <a href="#shop">Shop</a>
        <a href="#contact">Contact</a>
      </nav>

      <section class="hero">
        <div class="copy">
          <div class="eyebrow">Ideas take shape</div>
          <h1>Stickology <em>Studio</em></h1>
          <p class="description">A playful independent studio creating bold characters, strange stories and hand-drawn worlds.</p>
          <div class="actions">
            <a class="button" href="#work"><span>Explore work</span><b>→</b></a>
          </div>
        </div>

        <div class="art" aria-label="Illustration of a standing character">
          <div class="sun"></div>
          <div class="character">
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="body"></div>
            <div class="head">
              <div class="hair"></div>
              <div class="face-line"></div>
            </div>
          </div>
          <div class="scribble">drawn with feeling</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
